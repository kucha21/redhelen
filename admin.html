<!doctype html><html lang="ka"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RedHelen Admin</title><style>
body{margin:0;background:#f5eee5;color:#2b211b;font-family:Arial,"Noto Sans Georgian",sans-serif}.top{background:#24150f;color:#fff;padding:16px 20px;display:flex;justify-content:space-between}.wrap{max-width:1200px;margin:auto;padding:25px 18px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:#fffaf3;border:1px solid #ddd0c0;padding:18px;border-radius:10px}.stat b{display:block;font-size:26px;margin-top:6px}.tabs{display:flex;gap:8px;margin:20px 0;flex-wrap:wrap}.tab{padding:10px 15px;border:1px solid #d5c6b5;background:white;border-radius:8px;cursor:pointer}.panel{background:white;border:1px solid #ddd0c0;border-radius:12px;padding:18px;margin-top:12px}.table{overflow:auto}.table table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid #eee;text-align:left}.btn{padding:9px 13px;border:0;border-radius:7px;background:#b86b37;color:#fff;font-weight:700}.field{margin:7px 0}.field input,.field select,.field textarea{width:100%;padding:9px;border:1px solid #ddd;border-radius:6px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}@media(max-width:700px){.stats,.grid{grid-template-columns:1fr}.table{font-size:13px}}</style></head><body><div class="top"><b>RedHelen • Admin</b><button class="btn" onclick="logout()">გასვლა</button></div><div class="wrap"><div class="stats"><div class="stat">შეკვეთები<b id="orders">0</b></div><div class="stat">შემოსავალი<b id="revenue">₾0</b></div><div class="stat">მოგება<b id="profit">₾0</b></div><div class="stat">პროდუქტები<b id="products">0</b></div></div><div class="tabs"><button class="tab" onclick="show('ordersPanel')">შეკვეთები</button><button class="tab" onclick="show('productsPanel')">პროდუქტები</button><a class="tab" href="/api/admin/export/orders.csv">CSV ექსპორტი</a></div><section id="ordersPanel" class="panel"><h2>შეკვეთები</h2><div id="orderTable" class="table"></div></section><section id="productsPanel" class="panel" style="display:none"><h2>პროდუქტები</h2><form onsubmit="addProduct(event)" class="grid"><div class="field"><label>SKU</label><input id="sku" required></div><div class="field"><label>კატეგორია</label><input id="cat" required></div><div class="field"><label>სახელი KA</label><input id="nka" required></div><div class="field"><label>Name EN</label><input id="nen" required></div><div class="field"><label>Название RU</label><input id="nru" required></div><div class="field"><label>ფასი</label><input id="price" type="number" step=".01" required></div><div class="field"><label>თვითღირებულება</label><input id="cost" type="number" step=".01"></div><div class="field"><label>მარაგი</label><input id="stock" type="number" required></div><div class="field"><label>ფოტოს URL</label><input id="image"></div><div><button class="btn">პროდუქტის დამატება</button></div></form><div id="productTable" class="table" style="margin-top:20px"></div></section></div>
<script>
async function api(u,o){let r=await fetch(u,o);if(r.status===401)location="/admin/login";return r}
async function load(){let s=await api("/api/admin/dashboard").then(r=>r.json());orders.textContent=s.orders;revenue.textContent="₾"+s.revenue;profit.textContent="₾"+s.profit;products.textContent=s.products;let os=await api("/api/admin/orders").then(r=>r.json());orderTable.innerHTML="<table><tr><th>Order</th><th>კლიენტი</th><th>თანხა</th><th>სტატუსი</th><th>თარიღი</th></tr>"+os.map(o=>`<tr><td>${o.order_no}</td><td>${o.customer_name}<br>${o.phone}</td><td>₾${o.total}</td><td><select onchange="status(${o.id},this.value)">${["new","confirmed","making","ready","shipped","completed","cancelled"].map(x=>`<option ${x===o.status?"selected":""}>${x}</option>`).join("")}</select></td><td>${o.created_at}</td></tr>`).join("")+"</table>";let ps=await api("/api/admin/products").then(r=>r.json());productTable.innerHTML="<table><tr><th>SKU</th><th>სახელი</th><th>ფასი</th><th>თვითღირებულება</th><th>მარაგი</th></tr>"+ps.map(p=>`<tr><td>${p.sku}</td><td>${p.name_ka}</td><td>₾${p.price}</td><td>₾${p.cost}</td><td>${p.stock}</td></tr>`).join("")+"</table>"}
async function status(id,status){await api("/api/admin/orders/"+id,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({status})});load()}
async function addProduct(e){e.preventDefault();await api("/api/admin/products",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({sku:sku.value,category:cat.value,name_ka:nka.value,name_en:nen.value,name_ru:nru.value,price:price.value,cost:cost.value,stock:stock.value,image:image.value})});e.target.reset();load()}
async function logout(){await fetch("/api/admin/logout",{method:"POST"});location="/admin/login"}
function show(id){document.querySelectorAll("section.panel").forEach(x=>x.style.display="none");document.getElementById(id).style.display="block"}load()
</script></body></html>
