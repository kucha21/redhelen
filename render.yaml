services:
  - type: web
    name: redhelen
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: redhelen-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@redhelen.ge
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: redhelen-db
    plan: free
