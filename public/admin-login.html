<!doctype html><html lang="ka"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RedHelen Admin Login</title><style>body{font-family:Arial;background:#24150f;display:grid;place-items:center;min-height:100vh;margin:0}.box{background:#fffaf3;padding:30px;border-radius:14px;width:min(420px,92vw)}input,button{width:100%;padding:12px;margin:8px 0;border-radius:7px;border:1px solid #ddd}button{background:#b86b37;color:white;border:0;font-weight:700}</style></head><body><div class="box"><h1>RedHelen</h1><p>ადმინისტრატორის შესვლა</p><form onsubmit="login(event)"><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Password" required><button>შესვლა</button></form><p id="err"></p></div><script>async function login(e){e.preventDefault();let r=await fetch("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:email.value,password:password.value})});if(r.ok)location="/admin";else err.textContent="მონაცემები არასწორია";}</script></body></html>
